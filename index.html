<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리리와 함께하는 인천 세계시민 탐험</title>
<meta name="description" content="인천형 세계시민교육 × 읽걷쓰 AI × 금융교육 비주얼 노벨. 미션 8개, 넌센스 4개, AI 리리와 대결 4판, 스크래치 복권!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">📱 휴대폰은 <b>가로</b>로 돌려 주세요!</div>

<div id="stage">
  <div id="bgwrap"><img id="bgA" alt=""><img id="bgB" alt=""></div>
  <canvas id="ambient" width="1920" height="1080"></canvas>
  <div id="chars"></div>

  <div id="hud" class="hidden">
    <div class="pill" id="hudPlace">📍 우리 집</div>
    <div class="pill" id="hudRoute"></div>
    <div class="spacer"></div>
    <div class="pill" id="hudCombo"></div>
    <div class="pill" id="hudPass">통과 0/8</div>
    <div class="pill" id="hudMoney">💰 10,000원</div>
    <div class="pill" id="hudScore">⭐ 0점</div>
    <button class="pill btn" id="btnBadge" title="업적 배지">🏅 <span id="badgeCount">0</span></button>
    <button class="pill btn" id="btnSound" title="소리 켜기/끄기">🔊</button>
  </div>

  <div id="placecard"></div>

  <div id="textbox" class="hidden">
    <div id="namebox"></div>
    <div id="text"></div>
    <div id="ctc">▼</div>
  </div>

  <div id="overlay"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="toast"></div>
  <div id="flash"></div>
</div>

<div id="print-area"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/games.js"></script>
<script src="js/story.js"></script>
</body>
</html>
